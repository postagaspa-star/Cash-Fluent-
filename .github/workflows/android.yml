name: Build

on:
  push:
    branches: ["**"]
    # A `branches` filter on its own silently leaves tag pushes out, so without this
    # line the release job at the bottom could never run.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# The build job only reads the repository. The release job asks for write access on
# its own, and only when a tag is being published.
permissions:
  contents: read

# Never cancel a run in flight: the APK it is about to upload is a deliverable,
# and a cancelled run leaves no artifact behind at all.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      # The financial engine first. If the maths is wrong there is no point
      # producing an APK that shows the wrong numbers to a judge.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            -PbuildNumber=${{ github.run_number }} \
            -PbuildLabel=$(git rev-parse --short HEAD)

      - name: Name the APK by commit
        id: apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/cashfluent-${SHORT_SHA}.apk"
          echo "path=dist/cashfluent-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cashfluent-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Attach APK to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cashfluent-apk-${{ github.run_number }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            Cashfluent debug build.

            Install on Android: download the `.apk`, open it, and allow installs
            from this source when your phone asks. No account, no network, no ads.

            Educational content. Not financial advice.
